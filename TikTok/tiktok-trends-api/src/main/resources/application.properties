# ─────────────────────────────────────────
# Server
# ─────────────────────────────────────────
server.port=8080
spring.application.name=tiktok-trends-api

# ─────────────────────────────────────────
# PostgreSQL
# ─────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/tiktok_trends
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─────────────────────────────────────────
# Flyway (auto runs migrations on startup)
# ─────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─────────────────────────────────────────
# Redis
# ─────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# ─────────────────────────────────────────
# TikTok Research API
# ─────────────────────────────────────────
tiktok.api.base-url=https://open.tiktokapis.com/v2
tiktok.api.client-key=YOUR_TIKTOK_CLIENT_KEY
tiktok.api.client-secret=YOUR_TIKTOK_CLIENT_SECRET

# ─────────────────────────────────────────
# Claude / Anthropic AI
# ─────────────────────────────────────────
anthropic.api.key=YOUR_ANTHROPIC_API_KEY
anthropic.api.base-url=https://api.anthropic.com/v1
anthropic.api.model=claude-sonnet-4-20250514

# ─────────────────────────────────────────
# JWT Auth
# ─────────────────────────────────────────
jwt.secret=CHANGE_THIS_TO_A_STRONG_256BIT_SECRET_IN_PRODUCTION
jwt.expiration-ms=86400000

# ─────────────────────────────────────────
# Scheduling
# ─────────────────────────────────────────
# Ingest every 2 hours
tiktok.ingestion.cron=0 0 */2 * * *
