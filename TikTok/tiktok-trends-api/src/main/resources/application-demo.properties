# ─────────────────────────────────────────
# Demo profile overrides
# Allows running without PostgreSQL, Redis, or real API credentials
# ─────────────────────────────────────────

# H2 in-memory database (no PostgreSQL needed)
spring.datasource.url=jdbc:h2:mem:tiktok_trends;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway (H2 uses Hibernate DDL instead)
spring.flyway.enabled=false

# Simple in-memory cache (no Redis needed)
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# Disable scheduled ingestion in demo mode
tiktok.ingestion.cron=-

# Placeholder credentials (not used in demo mode)
tiktok.api.client-key=demo
tiktok.api.client-secret=demo
anthropic.api.key=demo
jwt.secret=demo-secret-key-must-be-at-least-64-bytes-long-for-hmac-sha-512-algorithm-padding

# Allow any origin in demo mode (for Vercel frontend)
tiktok.cors.allowed-origins=*
