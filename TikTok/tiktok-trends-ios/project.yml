name: TikTokTrends
options:
  bundleIdPrefix: com.kellykim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  TikTokTrends:
    type: application
    platform: iOS
    sources:
      - path: TikTokTrends
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kellykim.tiktoktrends
        INFOPLIST_FILE: TikTokTrends/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"TikTokTrends/Preview Content\""
        GENERATE_INFOPLIST_FILE: NO
